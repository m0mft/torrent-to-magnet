name: Torrent to Magnet Release

on:
  push:
    paths:
      - "**/*.torrent"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-libtorrent

      - name: Create converter script
        run: |
          cat > convert.py << 'PY'
          import libtorrent as lt
          import os, json, urllib.parse

          os.makedirs("output", exist_ok=True)

          torrent_files = []
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f.endswith(".torrent"):
                      torrent_files.append(os.path.join(root, f))

          all_data = []

          for path in torrent_files:
              info = lt.torrent_info(path)
              infohash = str(info.info_hash())
              name = info.name()

              trackers = [t.url for t in info.trackers()]

              magnet = "magnet:?xt=urn:btih:" + infohash
              magnet += "&dn=" + urllib.parse.quote(name)

              for tr in trackers:
                  magnet += "&tr=" + urllib.parse.quote(tr)

              storage = info.files()

              files_list = []
              for i in range(storage.num_files()):
                  files_list.append({
                      "path": storage.file_path(i),
                      "size": storage.file_size(i)
                  })

              data = {
                  "torrent_file": path,
                  "name": name,
                  "info_hash": infohash,
                  "total_size": info.total_size(),
                  "num_files": storage.num_files(),
                  "trackers": trackers,
                  "magnet_link": magnet,
                  "files": files_list
              }

              all_data.append(data)

              out = "output/magnet_" + os.path.basename(path) + ".json"
              with open(out, "w") as f:
                  json.dump(data, f, indent=2)

          if len(all_data) > 1:
              with open("output/index.json", "w") as f:
                  json.dump(all_data, f, indent=2)

          print("Processed", len(all_data), "torrents")
          PY

      - name: Run converter
        run: python3 convert.py

      - name: Create release tag
        id: tag
        run: |
          TAG=magnet-$(date +'%Y%m%d-%H%M%S')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Torrent Magnet Links
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
